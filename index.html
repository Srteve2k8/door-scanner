<!DOCTYPE html>
<html>
<head>
    <title>Door Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div id="reader"></div>

<script>

const powerAppUrl =
"https://apps.powerapps.com/play/e/354c67ea-5852-e646-bf45-e3b3d3287ca9/a/11eddc70-c00e-447d-8406-a3b57f09759c?tenantId=df399799-b361-4a99-97f8-936ac2ed402c";

function onScanSuccess(decodedText) {

    qrScanner.stop().then(() => {

        window.location.replace(
            powerAppUrl +
            "&door=" +
            encodeURIComponent(decodedText) +
            "&t=" +
            Date.now()
        );

    });

}

let qrScanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    }
);

qrScanner.render(onScanSuccess);

</script>

</body>
</html>
